<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="body">
    <header>
        <nav>
            <a class="btn btn-secondary" id="back" href="./index.html">Back</a>
            <div class="navbar-brandform container-fluid">
                Autobahn
            </div>
        </nav>
    </header>
    <main>
        <form action="#" method="GET" class="contact-form">
            <div class="form-row">
                <input type="text" id="name-field" name="name" placeholder="Enter full your name">
            </div>
            <div class="form-row">
                <input id="email-field" type="email" name="email" placeholder="Enter your E-mail">
            </div>
            <div class="form-row">
                <textarea name="message" id="message-field" cols="30" rows="10"
                    placeholder="Enter your message"></textarea>
            </div>
            <div class="form-row">
                <button type="submit">Submit</button>
                <button type="reset">Clear</button>
            </div>
        </form>
    </main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>

</html>
